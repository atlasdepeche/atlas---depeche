name: Distribute (auto-publicar en redes)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run distribute:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DISTRIBUTION_FACEBOOK_ENABLED: "true"
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DISTRIBUTION_X_ENABLED: "false"
          DISTRIBUTION_TELEGRAM_ENABLED: "false"
