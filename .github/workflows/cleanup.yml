name: Limpieza (retención de noticias viejas)

on:
  schedule:
    # Every 4h, not once/day — with RETENTION_DAYS=1 (24h) a once-daily
    # cron let an item sit up to ~48h before its cleanup pass came around,
    # not the "24 horas y se borran" the user asked for. Every 4h keeps
    # worst-case staleness closer to ~28h.
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run cleanup:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
